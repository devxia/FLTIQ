<svg xmlns="http://www.w3.org/2000/svg" width="840" height="256" viewBox="0 0 840 256" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">参考注释与长读长支持的转录本如何合并</title>
  <desc id="desc">左侧为一个具有三个外显子的参考转录本、一个具有相同剪接结构的完整匹配和一个跳过中间外显子的转录本。右侧的合并 GTF 含参考结构和外显子跳跃结构各一条。</desc>
  <defs>
    <g id="included" fill="currentColor">
      <path d="M0 0h154" stroke="currentColor" stroke-width="2.5"/>
      <rect x="0" y="-9" width="36" height="18" rx="2"/>
      <rect x="61" y="-9" width="34" height="18" rx="2"/>
      <rect x="118" y="-9" width="36" height="18" rx="2"/>
    </g>
    <g id="skipped" fill="currentColor">
      <path d="M0 0h154" stroke="currentColor" stroke-width="2.5"/>
      <rect x="0" y="-9" width="36" height="18" rx="2"/>
      <rect x="118" y="-9" width="36" height="18" rx="2"/>
    </g>
  </defs>
  <rect width="840" height="256" rx="10" fill="#f6f8f5"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" fill="#18342e">
    <g font-size="32" font-weight="650">
      <text x="31" y="51">输入转录本</text>
      <text x="522" y="51">合并 GTF</text>
    </g>
    <path d="M32 68h357 M522 68h285" fill="none" stroke="#cbd8d0" stroke-width="2"/>
    <g font-size="28">
      <text x="31" y="112">参考注释</text>
      <text x="31" y="164">完整匹配</text>
      <text x="31" y="216">外显子跳跃</text>
    </g>
  </g>
  <g color="#086d60">
    <use href="#included" x="211" y="102"/>
    <use href="#included" x="211" y="154"/>
    <use href="#included" x="557" y="102"/>
  </g>
  <g color="#985018">
    <use href="#skipped" x="211" y="206"/>
    <use href="#skipped" x="557" y="206"/>
  </g>
  <g fill="none" stroke="#086d60" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
